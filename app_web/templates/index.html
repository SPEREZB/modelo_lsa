    <style> 
        .nav {
    background-color: #5e35b1;  
    padding: 0.8rem 1.5rem;
    border-radius: 10px;
    margin: 0 auto 2.5rem;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    max-width: 800px;
}

.nav-list {
    display: flex;
    list-style: none;
    margin: 0;
    padding: 0;
    justify-content: center;
    gap: 1rem;
}

.nav-link {
    color: white;
    text-decoration: none;
    padding: 0.8rem 2rem;
    border-radius: 6px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    transition: all 0.3s ease;
    font-size: 1.05rem;
    background-color: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.15);
}

.nav-link i {
    font-size: 1.2rem;
}

.nav-link:hover {
    background-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

.nav-link.active {
    background-color: #7e57c2;  
    color: white;
    box-shadow: 0 4px 12px rgba(126, 87, 194, 0.4);
    font-weight: 600;
    border: 1px solid rgba(255, 255, 255, 0.25);
}
 

/* Responsive */
@media (max-width: 768px) {
    .nav {
        padding: 0.8rem;
        border-radius: 8px;
    }
    
    .nav-list {
        flex-direction: column;
        gap: 0.5rem;
    }
    
    .nav-link {
        width: 100%;
        justify-content: center;
        padding: 0.8rem 1rem;
    }
}
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2.2rem;
        }
    </style>
</head>

        <h1>Detección de Lengua de Señas</h1>
        
        <div class="camera-container" style="text-align: center; margin-bottom: 20px;">
            <video id="video" width="640" height="480" autoplay muted playsinline style="max-width: 100%; height: auto; border-radius: 8px;"></video>
            <canvas id="canvas" width="640" height="480" style="display: none;"></canvas>
        </div>
        
        <div class="controls" style="text-align: center; margin-bottom: 20px;">
            <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 10px;">
                <button id="startButton" class="btn" style="padding: 10px 20px; background-color: #5e35b1; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
                    <i class="fas fa-camera"></i> Iniciar Detección
                </button>
                <button id="switchCamera" class="btn" style="padding: 10px 20px; background-color: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; display: none;">
                    <i class="fas fa-sync-alt"></i> Cambiar Cámara
                </button>
            </div>
            <div id="status" style="margin-top: 10px; font-size: 16px; color: #333;">Presiona Iniciar para comenzar</div>
            <div id="result" style="margin-top: 10px; font-size: 18px; font-weight: bold;"></div>
            <div id="confidence" style="color: #666; margin-top: 5px;"></div>
        </div>
        
         
            <div id="confidence"></div>
        </div>
    </div>
