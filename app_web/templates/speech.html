<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar de Lengua de Señas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Avatar de Lengua de Señas</h4>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <p class="lead">Habla o escribe un texto para ver la traducción en lengua de señas</p>
                        </div>

                        <div class="d-flex justify-content-center gap-3 mb-3">
                            <button id="start-recording" class="btn btn-primary btn-lg">
                                <i class="fas fa-microphone me-2"></i>Grabar Audio
                            </button>
                            <button id="stop-recording" class="btn btn-danger btn-lg" disabled>
                                <i class="fas fa-stop me-2"></i>Detener
                            </button>
                        </div>

                        <div class="input-group mb-3">
                            <input type="text" id="text-input" class="form-control form-control-lg" 
                                   placeholder="O escribe un mensaje aquí...">
                            <button id="send-text" class="btn btn-secondary">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>

                        <div id="status" class="text-center text-muted">
                            Presiona grabar o escribe un texto
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];

        const startBtn = document.getElementById('start-recording');
        const stopBtn = document.getElementById('stop-recording');
        const statusDiv = document.getElementById('status');
        const sendTextBtn = document.getElementById('send-text');
        const textInput = document.getElementById('text-input');

        // Endpoint Flask (ajuste según su backend)
        const audioEndpoint = "{{ url_for('avatar.process_audio') }}";
        const textEndpoint = "{{ url_for('avatar.text_to_sign') }}";

        // Solicitar acceso al micrófono
        async function initMicrophone() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];
                    enviarAudio(blob);
                };

                startBtn.onclick = () => {
                    audioChunks = [];
                    mediaRecorder.start();
                    statusDiv.innerText = 'Grabando audio...';
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                };

                stopBtn.onclick = () => {
                    mediaRecorder.stop();
                    statusDiv.innerText = 'Procesando audio...';
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                };
            } catch (error) {
                statusDiv.innerText = 'No se pudo acceder al micrófono. Permiso denegado.';
            }
        }

        // Enviar audio al backend
        async function enviarAudio(blob) {
            const formData = new FormData();
            formData.append('audio', blob, 'grabacion.webm');

            const respuesta = await fetch(audioEndpoint, { method: 'POST', body: formData });
            const resultado = await respuesta.json();

            statusDiv.innerText = 'Traducción recibida: ' + resultado.sign || 'Avatar en movimiento';
        }

        // Enviar texto al backend
        sendTextBtn.onclick = async () => {
            const texto = textInput.value.trim();
            if (!texto) {
                statusDiv.innerText = 'Escribe un texto antes de enviar';
                return;
            }
            statusDiv.innerText = 'Enviando texto...';

            const respuesta = await fetch(textEndpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: texto })
            });
            const resultado = await respuesta.json();
            statusDiv.innerText = 'Avatar está interpretando: ' + resultado.sign || 'Avatar en movimiento';
        };

        // Inicializar micrófono al cargar la página
        initMicrophone();
    </script>
</body>
</html>
